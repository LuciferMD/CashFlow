services:
  api:
    container_name: auth
    build:
      context: ./Api
      dockerfile: Auth/Dockerfile
    ports:
      - "5046:80"
      - "7223:443"
    volumes:
      - ./Web/web/.vite/cert/localhost+2.pem:/app/https/cert.pem:ro
      - ./Web/web/.vite/cert/localhost+2-key.pem:/app/https/key.pem:ro
      - ./keys:/app/keys:ro
    environment:
      - ASPNETCORE_URLS=https://+443;http://+80
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/app/https/cert.pem
      - ASPNETCORE_Kestrel__Certificates__Default__KeyPath=/app/https/key.pem
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  weak_app:
    container_name: weak_app
    build:
      context: ./Api/WeakApp
      dockerfile: Dockerfile
    ports:
    - "8080:8080"

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  gateway:
    container_name: gateway
    build:
      context: ./Api
      dockerfile: Gateway/Dockerfile
    ports:
      - "5095:80"
    volumes:
      - ./keys:/app/keys:ro
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - Iot__BaseUrl=http://weak_app:8080
      - Iot__ApiKey=supersecret
      - Kafka__Brokers=kafka:9092
      - Kafka__Topic__IotSnapshots=iot.snapshots
    depends_on:
      kafka:
        condition: service_healthy
      weak_app:
        condition: service_started

  migrations:
    container_name: auth-migrations
    build:
      context: ./Api
      dockerfile: Auth/Dockerfile.migrations
    environment:
       - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["dotnet", "ef", "database", "update"]

  postgres:
    image: postgres:alpine
    restart: always
    container_name: postgres
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
        interval: 10s
        timeout: 5s
        retries: 5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: 
     - "5432:5432"
    
  web:
    container_name: web
    build:
      context: ./Web/web
      dockerfile: Dockerfile
    ports:
      - "3000:5173"
    environment:
      NODE_ENV: development
      VITE_AUTH_API_URL: ""
      AUTH_PROXY_TARGET: http://api:80
      GATEWAY_PROXY_TARGET: http://gateway:80
      HISTORY_PROXY_TARGET: http://history_store:4000
      NOTIFICATION_PROXY_TARGET: http://notification:80
    volumes:
      - ./Web/web:/react-app
      - /react-app/node_modules
      - ./Web/web/.vite/cert:/react-app/.vite/cert:ro
    stdin_open: true
    tty: true
    command: npm run dev -- --host

  mongodb:
    image: mongo:7-jammy
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  history_store:
    container_name: history_store
    build:
      context: ./Api/HistoryStore/history_store
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - ./keys:/app/keys:ro
    environment:
      MONGODB_URI: mongodb://mongodb:27017/history_store
      PORT: "4000"
      JwtOptions__PublicKeyPath: /app/keys/jwt-public.pem
      JwtOptions__Issuer: CashFlow.Auth
      JwtOptions__Audience: CashFlow
      INTERNAL_API_KEY: ${HISTORY_INTERNAL_API_KEY:-}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_IOT_SNAPSHOTS: iot.snapshots
      KAFKA_GROUP_ID: history-store
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_started


  notification:
    container_name: notification
    build:
      context: ./Api
      dockerfile: Notification/Dockerfile
    ports:
      - "6000:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - Kafka__Brokers=kafka:9092
      - Kafka__GroupId=notification-service
      - Kafka__Topic__IotSnapshots=iot.snapshots
      - Notification__HumidityThreshold=70
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN:-}
      - Telegram__ChatId=${TELEGRAM_CHAT_ID:-}
    depends_on:
      kafka:
        condition: service_healthy


volumes:
 postgres_data:
 mongodb_data:

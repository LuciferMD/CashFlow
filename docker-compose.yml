services:
  api:
    container_name: auth
    build:
      context: ./Api/Auth
      dockerfile: Dockerfile
    ports:
      - "5046:80"
      - "7223:443"
    volumes:
      - ./Web/web/.vite/cert/localhost+2.pem:/app/https/cert.pem:ro
      - ./Web/web/.vite/cert/localhost+2-key.pem:/app/https/key.pem:ro
      - ./keys:/app/keys:ro
    environment:
      - ASPNETCORE_URLS=https://+443;http://+80
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/app/https/cert.pem
      - ASPNETCORE_Kestrel__Certificates__Default__KeyPath=/app/https/key.pem
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  weak_app:
    container_name: weak_app
    build:
      context: ./Api/WeakApp
      dockerfile: Dockerfile
    ports:
    - "8080:8080"

  gateway:
    container_name: gateway
    build:
      context: ./Api/Gateway
      dockerfile: Dockerfile
    ports:
      - "5095:80"
    volumes:
      - ./keys:/app/keys:ro
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - Iot__BaseUrl=http://weak_app:8080
      - Iot__ApiKey=supersecret
    depends_on:
      - weak_app

  migrations:
    container_name: auth-migrations
    build:
      context: ./Api/Auth
      dockerfile: Dockerfile.migrations
    environment:
       - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["dotnet", "ef", "database", "update"]

  postgres:
    image: postgres:alpine
    restart: always
    container_name: postgres
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
        interval: 10s
        timeout: 5s
        retries: 5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: 
     - "5432:5432"
    
  web:
    container_name: web
    build:
      context: ./Web/web
      dockerfile: Dockerfile
    ports:
      - "3000:5173"
    environment:
      NODE_ENV: development
      VITE_AUTH_API_URL: ""
      AUTH_PROXY_TARGET: http://api:80
      GATEWAY_PROXY_TARGET: http://gateway:80
      HISTORY_PROXY_TARGET: http://history_store:4000
    volumes:
      - ./Web/web:/react-app
      - /react-app/node_modules
      - ./Web/web/.vite/cert:/react-app/.vite/cert:ro
    stdin_open: true
    tty: true
    command: npm run dev -- --host

  mongodb:
    image: mongo:7-jammy
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  history_store:
    container_name: history_store
    build:
      context: ./Api/HistoryStore/history_store
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - ./keys:/app/keys:ro
    environment:
      MONGODB_URI: mongodb://mongodb:27017/history_store
      PORT: "4000"
      JwtOptions__PublicKeyPath: /app/keys/jwt-public.pem
      JwtOptions__Issuer: CashFlow.Auth
      JwtOptions__Audience: CashFlow
      INTERNAL_API_KEY: ${HISTORY_INTERNAL_API_KEY:-}
    depends_on:
      - mongodb


volumes:
 postgres_data:
 mongodb_data:

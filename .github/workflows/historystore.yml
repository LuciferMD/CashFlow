name: HistoryStore CI

on:
  push:
    branches: [main, master]
    paths:
      - "Api/HistoryStore/**"
      - "Tests/HistoryStoreTests/**"
      - "Tests/pacts/HistoryStore-Gateway.json"
      - ".github/workflows/historystore.yml"
  pull_request:
    paths:
      - "Api/HistoryStore/**"
      - "Tests/HistoryStoreTests/**"
      - "Tests/pacts/HistoryStore-Gateway.json"
      - ".github/workflows/historystore.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Lint, build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Api/HistoryStore/history_store
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            Api/HistoryStore/history_store/package-lock.json
            Tests/HistoryStoreTests/package-lock.json

      - name: Install service dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install test dependencies
        working-directory: Tests/HistoryStoreTests
        run: npm ci

      - name: Test
        working-directory: Tests/HistoryStoreTests
        run: npm test

  docker:
    name: Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -f Api/HistoryStore/history_store/Dockerfile \
            -t cashflow-historystore:${{ github.sha }} \
            -t cashflow-historystore:latest \
            Api/HistoryStore/history_store

  docker-publish:
    name: Push image to Docker Hub
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Api/HistoryStore/history_store
          file: Api/HistoryStore/history_store/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cashflow-historystore:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cashflow-historystore:${{ github.sha }}

  deploy:
    name: Deploy to test server
    needs: docker-publish
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      # Requires a real host reachable over SSH with Docker installed.
      # Skipped unless the DEPLOY_ENABLED repository variable is set to
      # "true" (Settings > Secrets and variables > Actions > Variables),
      # and requires these secrets once you actually have a server:
      #   DEPLOY_HOST     - server IP/hostname
      #   DEPLOY_USER     - SSH user
      #   DEPLOY_SSH_KEY  - private key for that user
      #   DEPLOY_PORT     - optional, defaults to 22
      - name: Pull latest image & restart container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cashflow-historystore:latest
            docker stop cashflow-historystore || true
            docker rm cashflow-historystore || true
            docker run -d \
              --name cashflow-historystore \
              --restart unless-stopped \
              -p 4000:4000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/cashflow-historystore:latest
            # Apache on this host is assumed to already reverse-proxy
            # (e.g. history.example.com -> http://127.0.0.1:4000), so no
            # Apache config changes are needed here — only the container
            # image is refreshed.

name: Gateway CI

on:
  push:
    branches: [main, master]
    paths:
      - "Api/Gateway/**"
      - "Api/Shared/**"
      - "Tests/GatewayTests/**"
      - "Tests/pacts/Web-Gateway.json"
      - "Tests/pacts/Notification-Gateway.json"
      - "Tests/pacts/HistoryStore-Gateway.json"
      - ".github/workflows/gateway.yml"
  pull_request:
    paths:
      - "Api/Gateway/**"
      - "Api/Shared/**"
      - "Tests/GatewayTests/**"
      - "Tests/pacts/Web-Gateway.json"
      - "Tests/pacts/Notification-Gateway.json"
      - "Tests/pacts/HistoryStore-Gateway.json"
      - ".github/workflows/gateway.yml"
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: |
          dotnet restore Api/Gateway/Gateway.csproj
          dotnet restore Tests/GatewayTests/GatewayTests.csproj

      - name: Lint
        # EditorConfig whitespace + style gate (analyzers excluded — CS8618 etc. remain build warnings).
        run: |
          dotnet format whitespace Api/Gateway/Gateway.csproj --verify-no-changes
          dotnet format style Api/Gateway/Gateway.csproj --verify-no-changes --severity warn
          dotnet format whitespace Api/Shared/CashFlow.Shared.csproj --verify-no-changes
          dotnet format style Api/Shared/CashFlow.Shared.csproj --verify-no-changes --severity warn

      - name: Build
        run: |
          dotnet build Api/Gateway/Gateway.csproj -c Release --no-restore
          dotnet build Tests/GatewayTests/GatewayTests.csproj -c Release --no-restore

      - name: Test
        run: |
          dotnet test Tests/GatewayTests/GatewayTests.csproj \
            -c Release \
            --no-build \
            --verbosity normal \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=gateway-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-test-results
          path: Tests/GatewayTests/TestResults/**/*.trx
          if-no-files-found: ignore

  docker:
    name: Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -f Api/Gateway/Dockerfile \
            -t cashflow-gateway:${{ github.sha }} \
            -t cashflow-gateway:latest \
            Api

  docker-publish:
    name: Push image to Docker Hub
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Api
          file: Api/Gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cashflow-gateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cashflow-gateway:${{ github.sha }}

  deploy:
    name: Deploy to test server
    needs: docker-publish
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      # Requires a real host reachable over SSH with Docker installed.
      # Skipped unless the DEPLOY_ENABLED repository variable is set to
      # "true" (Settings > Secrets and variables > Actions > Variables),
      # and requires these secrets once you actually have a server:
      #   DEPLOY_HOST     - server IP/hostname
      #   DEPLOY_USER     - SSH user
      #   DEPLOY_SSH_KEY  - private key for that user
      #   DEPLOY_PORT     - optional, defaults to 22
      - name: Pull latest image & restart container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cashflow-gateway:latest
            docker stop cashflow-gateway || true
            docker rm cashflow-gateway || true
            docker run -d \
              --name cashflow-gateway \
              --restart unless-stopped \
              -p 5095:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/cashflow-gateway:latest
            # Apache on this host is assumed to already reverse-proxy
            # (e.g. gateway.example.com -> http://127.0.0.1:5095), so no
            # Apache config changes are needed here — only the container
            # image is refreshed.

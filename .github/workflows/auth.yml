name: Auth CI

on:
  push:
    branches: [main, master]
    paths:
      - "Api/Auth/**"
      - "Api/Shared/**"
      - "Tests/AuthTests/**"
      - "Tests/pacts/Web-Auth.json"
      - "Tests/pacts/contract-constants.json"
      - ".github/workflows/auth.yml"
  pull_request:
    paths:
      - "Api/Auth/**"
      - "Api/Shared/**"
      - "Tests/AuthTests/**"
      - "Tests/pacts/Web-Auth.json"
      - "Tests/pacts/contract-constants.json"
      - ".github/workflows/auth.yml"
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: |
          dotnet restore Api/Auth/Auth.csproj
          dotnet restore Tests/AuthTests/AuthTests.csproj

      - name: Lint
        # EditorConfig whitespace + style gate (analyzers excluded — CS8618 etc. remain build warnings).
        run: |
          dotnet format whitespace Api/Auth/Auth.csproj --verify-no-changes
          dotnet format style Api/Auth/Auth.csproj --verify-no-changes --severity warn
          dotnet format whitespace Api/Shared/CashFlow.Shared.csproj --verify-no-changes
          dotnet format style Api/Shared/CashFlow.Shared.csproj --verify-no-changes --severity warn

      - name: Build
        run: |
          dotnet build Api/Auth/Auth.csproj -c Release --no-restore
          dotnet build Tests/AuthTests/AuthTests.csproj -c Release --no-restore

      - name: Test
        run: |
          dotnet test Tests/AuthTests/AuthTests.csproj \
            -c Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=auth-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-test-results
          path: Tests/AuthTests/TestResults/**/*.trx
          if-no-files-found: ignore

  docker:
    name: Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -f Api/Auth/Dockerfile \
            -t cashflow-auth:${{ github.sha }} \
            -t cashflow-auth:latest \
            Api

  docker-publish:
    name: Push image to Docker Hub
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Api
          file: Api/Auth/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cashflow-auth:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cashflow-auth:${{ github.sha }}

  deploy:
    name: Deploy to test server
    needs: docker-publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Requires a real host reachable over SSH with Docker installed.
      # Secrets not yet configured -> this job will fail until a real
      # server exists and these are added:
      #   DEPLOY_HOST     - server IP/hostname
      #   DEPLOY_USER     - SSH user
      #   DEPLOY_SSH_KEY  - private key for that user
      #   DEPLOY_PORT     - optional, defaults to 22
      - name: Pull latest image & restart container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cashflow-auth:latest
            docker stop cashflow-auth || true
            docker rm cashflow-auth || true
            docker run -d \
              --name cashflow-auth \
              --restart unless-stopped \
              -p 5046:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/cashflow-auth:latest
            # Apache on this host is assumed to already reverse-proxy
            # (e.g. auth.example.com -> http://127.0.0.1:5046), so no
            # Apache config changes are needed here — only the container
            # image is refreshed.

name: Notification CI

on:
  push:
    branches: [main, master]
    paths:
      - "Api/Notification/**"
      - "Api/Shared/**"
      - "Tests/NotificationTests/**"
      - "Tests/pacts/Notification-Gateway.json"
      - ".github/workflows/notification.yml"
  pull_request:
    paths:
      - "Api/Notification/**"
      - "Api/Shared/**"
      - "Tests/NotificationTests/**"
      - "Tests/pacts/Notification-Gateway.json"
      - ".github/workflows/notification.yml"
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: |
          dotnet restore Api/Notification/Notification.csproj
          dotnet restore Tests/NotificationTests/NotificationTests.csproj

      - name: Lint
        # EditorConfig whitespace + style gate (analyzers excluded — CS8618 etc. remain build warnings).
        run: |
          dotnet format whitespace Api/Notification/Notification.csproj --verify-no-changes
          dotnet format style Api/Notification/Notification.csproj --verify-no-changes --severity warn
          dotnet format whitespace Api/Shared/CashFlow.Shared.csproj --verify-no-changes
          dotnet format style Api/Shared/CashFlow.Shared.csproj --verify-no-changes --severity warn

      - name: Build
        run: |
          dotnet build Api/Notification/Notification.csproj -c Release --no-restore
          dotnet build Tests/NotificationTests/NotificationTests.csproj -c Release --no-restore

      - name: Test
        run: |
          dotnet test Tests/NotificationTests/NotificationTests.csproj \
            -c Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=notification-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-test-results
          path: Tests/NotificationTests/TestResults/**/*.trx
          if-no-files-found: ignore

  docker:
    name: Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -f Api/Notification/Dockerfile \
            -t cashflow-notification:${{ github.sha }} \
            -t cashflow-notification:latest \
            Api

  docker-publish:
    name: Push image to Docker Hub
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Api
          file: Api/Notification/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cashflow-notification:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cashflow-notification:${{ github.sha }}

  deploy:
    name: Deploy to test server
    needs: docker-publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Requires a real host reachable over SSH with Docker installed.
      # Secrets not yet configured -> this job will fail until a real
      # server exists and these are added:
      #   DEPLOY_HOST     - server IP/hostname
      #   DEPLOY_USER     - SSH user
      #   DEPLOY_SSH_KEY  - private key for that user
      #   DEPLOY_PORT     - optional, defaults to 22
      - name: Pull latest image & restart container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cashflow-notification:latest
            docker stop cashflow-notification || true
            docker rm cashflow-notification || true
            docker run -d \
              --name cashflow-notification \
              --restart unless-stopped \
              -p 6000:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/cashflow-notification:latest
            # Apache on this host is assumed to already reverse-proxy
            # (e.g. notification.example.com -> http://127.0.0.1:6000), so
            # no Apache config changes are needed here — only the
            # container image is refreshed.

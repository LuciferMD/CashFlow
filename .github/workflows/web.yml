name: Web CI

on:
  push:
    branches: [main, master]
    paths:
      - "Web/web/**"
      - "Tests/pacts/Web-Auth.json"
      - "Tests/pacts/Web-Gateway.json"
      - "Tests/pacts/contract-constants.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "Web/web/**"
      - "Tests/pacts/Web-Auth.json"
      - "Tests/pacts/Web-Gateway.json"
      - "Tests/pacts/contract-constants.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Lint, build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Web/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run

  docker:
    name: Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -f Web/web/Dockerfile \
            -t cashflow-web:${{ github.sha }} \
            -t cashflow-web:latest \
            Web/web
